<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="sales1 avatar, account executive with chart badge, circular crop">
  <defs>
    <clipPath id="sl1Clip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="sl1Glow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sl1Dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#00d2ff" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#sl1Clip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#sl1Glow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#sl1Dots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#sl1Dots)"/>
    </g>
    <g id="sl1-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- side ponytail (behind head) -->
      <path d="M 18,-54 C 62,-40 70,14 54,66 C 50,80 38,82 32,72 C 46,26 42,-22 10,-40 Z" fill="#2b2140" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <!-- torso shirt -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#101827" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <!-- lapels -->
      <path d="M -22,66 L 0,78 L -10,92 Z" fill="#16223a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 22,66 L 0,78 L 10,92 Z" fill="#16223a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <!-- chart badge -->
      <rect x="-18" y="128" width="10" height="16" fill="#22d3ee" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-4" y="120" width="10" height="24" fill="#67e8f9" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <rect x="10" y="110" width="10" height="34" fill="#c084fc" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <polyline points="-20,122 -4,112 8,116 20,102" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="26,96 14,100 22,108" fill="#00d2ff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#8d5a3b" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#8d5a3b" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#8d5a3b" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#8d5a3b" stroke="#000000" stroke-width="6"/>
      <!-- earrings -->
      <circle cx="-46" cy="-26" r="4" fill="#00d2ff" stroke="#000000" stroke-width="3"/>
      <circle cx="46" cy="-26" r="4" fill="#00d2ff" stroke="#000000" stroke-width="3"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- blush -->
      <ellipse cx="-31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.6"/>
      <ellipse cx="31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.6"/>
      <!-- smile -->
      <path d="M -8,-26 Q 0,-17 8,-26" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- hair cap -->
      <path d="M -46,-56 C -48,-116 48,-116 46,-56 C 38,-78 20,-84 0,-84 C -20,-84 -38,-78 -46,-56 Z" fill="#2b2140" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <!-- ponytail tie -->
      <circle cx="52" cy="-64" r="7" fill="#00d2ff" stroke="#000000" stroke-width="4"/>
      </g>
    </g>
    <g id="sl1-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#00d2ff" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#c084fc" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
