<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="customer_success avatar, success manager with heart badge, circular crop">
  <defs>
    <clipPath id="cssClip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="cssGlow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cssDots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#00d2ff" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#cssClip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#cssGlow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#cssDots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#cssDots)"/>
    </g>
    <g id="css-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- long wavy hair (back) -->
      <path d="M -8,-66 C -60,-52 -68,14 -56,94 C -52,108 -38,110 -34,96 C -46,26 -38,-32 4,-52 Z" fill="#3a2b5e" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 8,-66 C 60,-52 68,14 56,94 C 52,108 38,110 34,96 C 46,26 38,-32 -4,-52 Z" fill="#3a2b5e" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <!-- torso -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#131722" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <path d="M -22,66 C -14,82 14,82 22,66 Z" fill="#232038" stroke="#000000" stroke-width="5"/>
      <!-- heart badge -->
      <g transform="translate(0,116) scale(0.9)">
        <path d="M 0,26 C -22,10 -32,-2 -32,-16 C -32,-28 -22,-34 -14,-34 C -7,-34 -2,-30 0,-24 C 2,-30 7,-34 14,-34 C 22,-34 32,-28 32,-16 C 32,-2 22,10 0,26 Z" fill="#e879f9" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="-12" cy="-18" r="4" fill="#ffffff" opacity="0.6"/>
      </g>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#f3d5b0" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#f3d5b0" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#f3d5b0" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#f3d5b0" stroke="#000000" stroke-width="6"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- blush -->
      <ellipse cx="-31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
      <ellipse cx="31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
      <!-- warm open smile -->
      <path d="M -9,-27 Q 0,-14 9,-27 Z" fill="#7a2e3f" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
      <!-- fringe with violet streak -->
      <path d="M -46,-56 C -48,-116 48,-116 46,-56 C 38,-78 20,-84 0,-84 C -20,-84 -38,-78 -46,-56 Z" fill="#3a2b5e" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <path d="M -28,-62 C -10,-72 16,-72 30,-62" fill="none" stroke="#e879f9" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <!-- front strands over shoulders -->
      <path d="M -50,-40 C -58,20 -54,80 -44,118 C -40,130 -28,130 -30,116 C -38,64 -38,8 -36,-38 Z" fill="#3a2b5e" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 50,-40 C 58,20 54,80 44,118 C 40,130 28,130 30,116 C 38,64 38,8 36,-38 Z" fill="#3a2b5e" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </g>
    <g id="css-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#e879f9" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#00d2ff" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
